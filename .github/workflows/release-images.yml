name: release-images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-images
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash mvnw -B clean verify
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-k8s.txt
      - run: python scripts/validate-k8s.py
      - run: python scripts/smoke-test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-jars
          path: mall-*/target/mall-*-0.1.0-SNAPSHOT.jar
          retention-days: 7
  images:
    needs: verify
    runs-on: ubuntu-latest
    environment: release-images
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth, product, inventory, order, member, payment]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-jars
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image identity
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}/mall-${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build image
        env:
          SERVICE: ${{ matrix.service }}
          JAVA_IMAGE: ${{ vars.JAVA_IMAGE }}
        run: |
          [[ "$JAVA_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || { echo 'Set JAVA_IMAGE to an approved Java 21 Linux image digest'; exit 1; }
          docker build -f deploy/Dockerfile --build-arg "SERVICE=mall-$SERVICE" --build-arg "JAVA_IMAGE=$JAVA_IMAGE" -t "$IMAGE" .
      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.69.3
          format: table
          output: vulnerability-report.txt
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.69.3
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
      - name: Push scanned image and record immutable reference
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" > "mall-$SERVICE.digest.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-${{ matrix.service }}
          path: |
            *.digest.txt
            vulnerability-report.txt
            sbom.cdx.json
          retention-days: 90
