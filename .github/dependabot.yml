version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      spring-platform:
        patterns: ["org.springframework.boot:*", "org.springframework.cloud:*", "com.alibaba.cloud:*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy
    target-branch: develop
    schedule:
      interval: weekly
