server:
  port: ${SERVER_PORT:9000}
  error:
    include-message: never
spring:
  application:
    name: mall-auth
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
mall:
  security:
    issuer: selfmall
    jwt-secret: ${MALL_JWT_SECRET}
seata:
  enabled: false
