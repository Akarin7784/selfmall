apiVersion: v1
kind: ResourceQuota
metadata:
  name: mall-budget
spec:
  hard:
    requests.cpu: '20'
    requests.memory: 32Gi
    limits.cpu: '40'
    limits.memory: 48Gi
    pods: '40'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mall-defaults
spec:
  limits:
    - type: Container
      default:
        cpu: '1'
        memory: 768Mi
      defaultRequest:
        cpu: 250m
        memory: 384Mi
