apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mall-gateway
spec:
  ingressClassName: nginx
  tls:
    - hosts: [mall.example.com]
      secretName: mall-tls
  rules:
    - host: mall.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mall-gateway
                port:
                  number: 8080
