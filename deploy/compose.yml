name: selfmall-dev
services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: mall_product
      MYSQL_USER: mall_product
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.3-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
  nacos:
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in deploy/.env}
      NACOS_AUTH_IDENTITY_KEY: selfmallDev
      NACOS_AUTH_IDENTITY_VALUE: selfmallLocalOnly
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes: ["nacos-data:/home/nacos/data", "nacos-logs:/home/nacos/logs"]
  rocketmq-nameserver:
    image: apache/rocketmq:5.3.1
    profiles: ["extended"]
    command: sh mqnamesrv
    ports: ["127.0.0.1:9876:9876"]
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    profiles: ["extended"]
    depends_on: [rocketmq-nameserver]
    command: sh mqbroker -n rocketmq-nameserver:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    ports: ["127.0.0.1:10909:10909", "127.0.0.1:10911:10911"]
    volumes: ["./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf:ro"]
  seata:
    image: apache/seata-server:2.5.0
    profiles: ["extended"]
    environment:
      SEATA_IP: 127.0.0.1
      SEATA_PORT: 8091
      STORE_MODE: file
    ports: ["127.0.0.1:7091:7091", "127.0.0.1:8091:8091"]
volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
